<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – Lucky Win India</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0d0d0d;--line:#3a3017;--gold:#d4af37;--gold2:#f0d27a;--text:#fff;--muted:#b9b4a3;--err:#ff6b6b;--ok:#6fd49b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;margin:0;color:var(--gold2)}
h1{font-size:34px}h2{font-size:26px;margin:34px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;margin-top:16px}
label{display:block;font-size:14px;margin:12px 0 6px}
input,select{width:100%;padding:12px;border:1px solid var(--line);background:#000;color:var(--text);font:inherit;border-radius:4px}
.btn{padding:12px 16px;border:0;background:var(--gold);color:#000;font:inherit;font-weight:700;border-radius:4px;cursor:pointer;margin-top:14px}
.btn.alt{background:none;border:1px solid var(--gold);color:var(--gold)}
.btn.sm{padding:6px 10px;margin:0;font-size:13px}
.msg{margin-top:12px;font-size:14px;min-height:20px}
.err{color:var(--err)}.ok{color:var(--ok)}
.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.stat b{display:block;font-size:28px;color:var(--gold2);font-family:"Cormorant Garamond",Georgia,serif}
.stat span{font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--gold);font-weight:600;background:var(--panel)}
.empty{color:var(--muted);padding:14px}
.draw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Lucky Win India – Admin</h1>

  <section class="card" id="login">
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="btn" type="submit">Log in</button>
      <div class="msg err" id="loginMsg"></div>
    </form>
  </section>

  <section class="card hide" id="denied">
    <p>This account is not an admin.</p>
    <button class="btn alt" onclick="sb.auth.signOut()">Log out</button>
  </section>
